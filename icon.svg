<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="primaryGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 背景ベース -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad1)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- メール封筒ベース -->
  <g filter="url(#shadow1)">
    <rect x="100" y="150" width="312" height="230" rx="32" fill="#1e293b" stroke="url(#primaryGrad1)" stroke-width="6" />
    <path d="M104 170 L256 280 L408 170" fill="none" stroke="url(#primaryGrad1)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- 完了チェックマーク（封筒から飛び出すデザイン） -->
  <g>
    <circle cx="370" cy="150" r="54" fill="url(#accentGrad1)" stroke="#0f172a" stroke-width="8" />
    <path d="M346 150 L364 168 L396 134" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- タスクリストライン -->
  <line x1="150" y1="270" x2="230" y2="270" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <line x1="150" y1="310" x2="310" y2="310" stroke="#475569" stroke-width="6" stroke-linecap="round" />
</svg>
